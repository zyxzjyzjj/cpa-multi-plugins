name: Build & Release Plugins

on:
  push:
    tags:
      - 'v*'
    # Deep-audit A2 fix (v0.12.76): also run CI on main pushes so the branch
    # badge reflects reality (previously the latest main-ref run was a
    # cancelled dispatch, rendering the badge permanently "failing" while
    # tag runs were green for 76+ consecutive releases).
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.0)'
        required: true
        default: 'v0.12.88'

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            cc: gcc
            ext: so
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            cc: gcc
            ext: so
          # NOTE: darwin-amd64 used to ride the retired macos-13 Intel hosted
          # runners (they queued forever and blocked the release job via
          # needs: build). issue #7 brings the asset back as a CROSS build on
          # the arm64 runner: Apple's clang accepts -arch x86_64 on Apple
          # Silicon and the Go cgo toolchain drives it via CC. optional:true
          # keeps a toolchain regression from blocking the other four assets.
          - os: darwin
            arch: amd64
            runner: macos-14
            goos: darwin
            goarch: amd64
            cc: "clang -arch x86_64"
            ext: dylib
            optional: true
          - os: darwin
            arch: arm64
            runner: macos-14
            goos: darwin
            goarch: arm64
            cc: clang
            ext: dylib
          - os: windows
            arch: amd64
            runner: windows-latest
            goos: windows
            goarch: amd64
            cc: mingw-w64-x86_64-gcc
            ext: dll
    continue-on-error: ${{ matrix.optional || false }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false

      - name: Set up MSYS2 (Windows only)
        if: matrix.os == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
          update: false
          path-type: inherit

      - name: Build all plugins (Windows)
        if: matrix.os == 'windows'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CC: gcc
        run: |
          set -euo pipefail
          which gcc 2>&1 || echo "which gcc failed"
          gcc --version 2>&1 | head -1 || echo "gcc invocation failed"
          VERSION=$(tr -d '\r\n' < VERSION)
          mkdir -p dist/${{ matrix.os }}-${{ matrix.arch }}
          PLUGINS=$(python -c 'import json; print(" ".join(p["id"] for p in json.load(open("registry.json", encoding="utf-8"))["plugins"]))')
          for plugin in $PLUGINS; do
            echo "=== Building $plugin ==="
            cd plugins/$plugin
            go mod download
            if [ "$GOOS-$GOARCH" != "darwin-amd64" ]; then go test ./...; fi
            OUTPUT="../../dist/${{ matrix.os }}-${{ matrix.arch }}/${plugin}.${{ matrix.ext }}"
            go build -buildmode=c-shared -trimpath -ldflags="-s -w -X main.version=$VERSION" -o "$OUTPUT" .
            if [ $? -eq 0 ]; then
              echo "  ✅ $plugin built"
            else
              echo "  ❌ $plugin failed"
              exit 1
            fi
            cd ../..
          done
        shell: msys2 {0}

      - name: Build all plugins (non-Windows)
        if: matrix.os != 'windows'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CC: ${{ matrix.cc }}
        run: |
          set -euo pipefail
          VERSION=$(tr -d '\r\n' < VERSION)
          mkdir -p dist/${{ matrix.os }}-${{ matrix.arch }}
          PLUGINS=$(python -c 'import json; print(" ".join(p["id"] for p in json.load(open("registry.json", encoding="utf-8"))["plugins"]))')
          for plugin in $PLUGINS; do
            echo "=== Building $plugin ==="
            cd plugins/$plugin
            go mod download
            if [ "$GOOS-$GOARCH" != "darwin-amd64" ]; then go test ./...; fi
            OUTPUT="../../dist/${{ matrix.os }}-${{ matrix.arch }}/${plugin}.${{ matrix.ext }}"
            go build -buildmode=c-shared -trimpath -ldflags="-s -w -X main.version=$VERSION" -o "$OUTPUT" .
            if [ $? -eq 0 ]; then
              echo "  ✅ $plugin built"
            else
              echo "  ❌ $plugin failed"
              exit 1
            fi
            cd ../..
          done
        shell: bash

      - name: Package store and manual artifacts
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.version }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          if [ -z "$VERSION" ]; then VERSION=$(tr -d '\r\n' < VERSION); fi
          test "$VERSION" = "$(tr -d '\r\n' < VERSION)" || { echo "Tag must match VERSION and registry.json"; exit 1; }
          python -m unittest discover -s scripts -p 'test_*.py'
          node --test plugins/codearts-provider/tools/panel-regression.test.cjs
          python scripts/package-release.py "$VERSION" ${{ matrix.os }} ${{ matrix.arch }}
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cpa-multi-plugins-${{ matrix.os }}-${{ matrix.arch }}
          path: release-assets/*
          retention-days: 30

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    # Deep-audit hardening: publish only when the build job itself succeeded.
    # The optional darwin-amd64 cross leg keeps reporting success via
    # continue-on-error, so a toolchain regression there still cannot block a
    # release -- but a REQUIRED leg failing now skips the release instead of
    # silently shipping an incomplete asset set.
    # v0.12.76: tag-gated as well — main-branch CI runs (badge refresh) must
    # build but NEVER publish. workflow_dispatch keeps its version input path.
    if: always() && !cancelled() && needs.build.result == 'success' && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -name "*.zip" -exec cp {} release/ \;
          find artifacts -name "checksums-*.txt" -exec cat {} \; > release/checksums.txt
          ls -lh release/

      - name: Determine version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.version }}
        run: |
          echo "version=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: cpa-multi-plugins ${{ steps.version.outputs.version }}
          body: |
            # cpa-multi-plugins ${{ steps.version.outputs.version }}

            5 CPA providers: **CodeBuddy/WorkBuddy**, **Qoder**, **Trae**, **ZCode**, **CodeArts** — each merges the former CN/Intl/solo variants with automatic legacy auth-file adoption.

            Third-party store: https://raw.githubusercontent.com/${{ github.repository }}/main/registry.json
            Store assets use `<provider>_<version>_<os>_<arch>.zip`; `checksums.txt` contains SHA-256 checksums.

            ## Downloads
            - `cpa-multi-plugins-linux-amd64.zip` — Linux x86_64
            - `cpa-multi-plugins-linux-arm64.zip` — Linux ARM64
            - `cpa-multi-plugins-darwin-arm64.zip` — macOS Apple Silicon
            - `cpa-multi-plugins-darwin-amd64.zip` — macOS Intel (cross-built on an arm64 runner)
            - `cpa-multi-plugins-windows-amd64.zip` — Windows x86_64

            ## Installation (verified against real CLIProxyAPI host)
            1. Download and unzip the archive for your platform.
            2. Copy the `.so`/`.dylib`/`.dll` files to your CPA plugins directory (e.g. `plugins/linux/amd64/`).
            3. **Each plugin must be explicitly enabled** in `config.yaml` (per-plugin default is disabled):
               ```yaml
               plugins:
                 enabled: true
                 dir: "plugins"
                 configs:
                   workbuddy: { enabled: true }
                   qoder: { enabled: true }
                   trae: { enabled: true }
                   zcode: { enabled: true }
                   codearts-provider: { enabled: true }
               ```
            4. Restart CPA and check logs for `pluginhost: plugin registered plugin_id=workbuddy/qoder/trae/zcode/codearts-provider`.
            5. Login accounts via the management panel or Management API. Legacy `codebuddy-cn-/codebuddy-intl-/qoder-cn-/qoder-intl-/trae-cn-/trae-solo-cn-/trae-intl-` auth files are adopted automatically.

            ## Plugins
            | Plugin | Covers | Realms | Login options |
            |---|---|---|---|
            | workbuddy | CodeBuddy + WorkBuddy + codebuddy-cn + codebuddy-intl | CN (copilot.tencent.com) / Global (workbuddy.ai) / Intl (codebuddy.ai) | CLI + IDE, per-account region |
            | qoder | Qoder + qoder-cn + qoder-intl | CN (qoder.com.cn) / Intl (qoder.com) | Device flow + PAT, per-account region |
            | trae | Trae CN + Trae SOLO CN + Trae Intl | CN (api.trae.cn) / SOLO / Intl (marscode) | Per-variant device flow |
            | zcode | GLM coding plan | Z.AI / BigModel | Browser login |
            | codearts-provider | Huawei CodeArts Agent / Doer | Huawei Cloud | OAuth PKCE / DPoP, AK/SK import |

            See [README](https://github.com/${{ github.repository }}#readme) for details.
          files: |
            release/*.zip
            release/checksums.txt
          draft: false
          prerelease: false
